name: pythonchi
description: "Pythonchi — Омӯзиши Python аз сифр то сатҳи касбӣ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local database (offline-first)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage (API keys, tokens)
  flutter_secure_storage: ^9.2.2

  # Networking (AI module)
  http: ^1.2.1
  dio: ^5.5.0+1

  # Code editor / syntax highlighting for Playground
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  code_text_field: ^1.1.0

  # UI / UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  confetti: ^0.7.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0

  # Persistence helpers
  shared_preferences: ^2.2.3

  # Utility
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Icons & splash generation
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo/
    - assets/lessons/
    - assets/lessons/quizzes/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  adaptive_icon_background: "#1A1B3A"
  adaptive_icon_foreground: "assets/images/logo/app_icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1A1B3A"
  image: assets/images/logo/splash_logo.png
  color_dark: "#0F1024"
  image_dark: assets/images/logo/splash_logo.png
  android_12:
    color: "#1A1B3A"
    image: assets/images/logo/splash_logo.png
    color_dark: "#0F1024"
    image_dark: assets/images/logo/splash_logo.png
